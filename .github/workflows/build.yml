name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack extension (ZEX zip -> assets/zex)
        run: |
          mkdir -p app/src/main/assets/zex
          unzip -q -o ZEX*.zip -d app/src/main/assets/zex
          if [ ! -f app/src/main/assets/zex/manifest.json ]; then
            d=$(dirname "$(find app/src/main/assets/zex -name manifest.json | head -1)")
            cp -r "$d"/. app/src/main/assets/zex/
          fi
          ls app/src/main/assets/zex | head -20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ZBrowser-apk
          path: app/build/outputs/apk/debug/app-debug.apk
